
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Writing Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }
        textarea {
            width: 100%;
            height: 350px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>My Writing Space</h1>
    <p>Write your thoughts, notes, or essays below.</p>

    <textarea id="writing"
        placeholder="Start writing here..."></textarea>
    <br>
    <button onclick="saveText()">Save Writing</button>
    <p id="message"></p>

    <script>
        const editor = document.getElementById("writing");

        editor.value = localStorage.getItem("myWriting") || "";

        function saveText() {
            localStorage.setItem("myWriting", editor.value);
            document.getElementById("message").textContent =
                "Your writing has been saved on this browser!";
        }
    </script>
</body>
</html>
